<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)">
  <title>Watchlist</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Watchlist</h1>
      <span id="count"></span>
    </header>

    <p id="loading" class="muted">Loading…</p>

    <form id="login" hidden>
      <label for="key">Key</label>
      <div class="row">
        <input id="key" type="password" autocomplete="current-password" minlength="6" required
               aria-describedby="key-hint">
        <button>Open</button>
      </div>
      <p id="key-hint" class="muted hint">Each key opens its own list, on any device. A new key starts a new list,
        so pick something only you know, at least 6 characters.</p>
      <p id="login-error" class="error" role="alert"></p>
    </form>

    <section id="list" hidden>
      <form id="add" class="row">
        <input id="title" type="text" placeholder="Add a film or series…" maxlength="200"
               autocomplete="off" enterkeyhint="done" aria-label="Title">
        <button>Add</button>
      </form>
      <ul id="todo"></ul>
      <p id="empty" class="muted"></p>
      <details id="watched">
        <summary>Watched <span id="done-count"></span></summary>
        <ul id="done"></ul>
      </details>
      <button id="switch" type="button" class="link">Use another key</button>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite">
    <span id="toast-text"></span>
    <button id="toast-undo" type="button" hidden>Undo</button>
  </div>
</body>
</html>
